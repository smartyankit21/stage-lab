# Runs every weekday after market close: download prices -> compute -> save data -> publish site.
#
# Production vs experiments:
#   - Only a run on `main` saves the `data` branch and publishes the live `site` branch.
#   - A run started on any other branch (e.g. `dev`) keeps its own data copy in `data-dev`
#     (started from `data`) and publishes to `site-dev` (the experiment preview). It never
#     changes `data` or the live `site`.
name: daily-update

on:
  schedule:
    # Odd minutes on purpose: GitHub starts jobs set for :00/:15/:30/:45 much later when it's busy.
    - cron: "23 13 * * 1-5"   # 6:53 pm IST
    - cron: "37 14 * * 1-5"   # 8:07 pm IST, backup
    - cron: "11 16 * * 1-5"   # 9:41 pm IST, catches exchange files that were published late
  workflow_dispatch: {}        # "Run workflow" button for a manual run

permissions:
  contents: write              # to save the data branch

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: pip install -r requirements.txt

      - name: Check the engine
        run: python -m pytest -q tests

      - name: Restore saved data (price history, delivery, industries, holidays)
        env:
          DATA_BRANCH: ${{ github.ref == 'refs/heads/main' && 'data' || 'data-dev' }}
        run: |
          # main uses `data`. Experiment branches use their own `data-dev` copy, started from `data` the first time.
          if git fetch --depth=1 origin "$DATA_BRANCH"; then git archive FETCH_HEAD | tar -x
          elif git fetch --depth=1 origin data; then git archive FETCH_HEAD | tar -x; fi
          ls -la data data/meta || echo "No saved data yet - the first run builds the full history"

      - name: Download today's prices and compute
        run: python -m engine.run_daily

      - name: Save data (main -> `data`; any other branch -> `data-dev`, never the live data)
        env:
          DATA_BRANCH: ${{ github.ref == 'refs/heads/main' && 'data' || 'data-dev' }}
        run: |
          set -e
          tmp=$(mktemp -d)
          mkdir -p "$tmp/data"
          cp data/prices.parquet "$tmp/data/"
          if [ -f data/indices.parquet ]; then cp data/indices.parquet "$tmp/data/"; fi
          if [ -f data/delivery_all.parquet ]; then cp data/delivery_all.parquet "$tmp/data/"; fi
          cp -r data/meta "$tmp/data/"
          cd "$tmp"
          git init -q && git checkout -q --orphan "$DATA_BRANCH"
          git add -A
          git -c user.name="stage-lab bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Data as of $(date +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:$DATA_BRANCH"

      - name: Publish the website (main -> live `site`; any other branch -> `site-dev` preview)
        env:
          TARGET: ${{ github.ref == 'refs/heads/main' && 'site' || 'site-dev' }}
        run: |
          set -e
          echo "Publishing to branch: $TARGET"
          tmp=$(mktemp -d)
          cp -r site/. "$tmp/"
          printf '[build]\n  publish = "."\n  command = ""\n\n[functions]\n  directory = "netlify/functions"\n\n[[headers]]\n  for = "/data/*"\n  [headers.values]\n    Cache-Control = "public, max-age=300, must-revalidate"\n\n[[headers]]\n  for = "/screeners/*"\n  [headers.values]\n    Content-Type = "text/javascript; charset=utf-8"\n' > "$tmp/netlify.toml"
          cd "$tmp"
          git init -q && git checkout -q --orphan "$TARGET"
          git add -A
          git -c user.name="stage-lab bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Site as of $(date +%F) from ${{ github.ref_name }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:$TARGET"
